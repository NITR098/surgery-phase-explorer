[project]
name = "surgery-phase-explorer"
version = "0.1.0"
description = "Load public surgical video datasets with phase annotations and visualize how they were labeled (timelines, boundary montages, interactive player)"
authors = [{ name = "Ehsan", email = "engtekh@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# scripts/ stays a plain folder of CLIs; only the library is a package.
# Use `pip install -e .` (editable) — phase_atlas resolves datasets.json
# relative to the repo folder, so a copied site-packages install won't find it.
packages = ["phase_atlas", "phase_atlas.loaders"]
